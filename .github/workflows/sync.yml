name: sync

on:
  schedule:
    # GitHub cron is UTC only: 06:00 Berlin in summer, 05:00 in winter. Close enough.
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # The path guard runs in CI too. If it ever regresses, nothing gets scraped.
      - run: uv run scraper/selfcheck.py

      - name: Scrape
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_COURSE_ID: ${{ secrets.CANVAS_COURSE_ID }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          CANVAS_CLASS_SLUG: cs-hl
          TERM_START: "2026-08-01"
          TODDLE_STORAGE_STATE: ${{ secrets.TODDLE_STORAGE_STATE }}
          # School-wide and opaque, not a secret. Changes each August.
          TODDLE_ACADEMIC_YEAR_ID: "264569948024607329"
        # stdout is the commit message; progress goes to stderr.
        run: |
          uv run scraper/sync.py > /tmp/commit-msg.txt
          cat /tmp/commit-msg.txt

      # Only reached when the scrape succeeded, so a failed run commits nothing.
      - name: Commit
        run: |
          git config user.name "school-vault bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -F /tmp/commit-msg.txt
          git push
